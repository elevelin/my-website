<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title -->
    <title>Amber Rasmussen | Touch of Ambrosia</title>
    <link class="icon" type="image/png" href="images/avatar.png">

    <!-- Meta Description -->
    <meta name="description" content="Welcome to Touch of Ambrosia. Explore my latest projects, social links, and updates here.">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://touchofambrosia.com">

    <!-- Author Information -->
    <meta name="author" content="Amber Rasmussen">

    <!-- Browser UI Color -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Social Sharing (Open Graph & Twitter) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Amber Rasmussen | Touch of Ambrosia">
    <meta property="og:description" content="Explore my latest projects, social links, and updates.">
    <meta property="og:url" content="https://touchofambrosia.com">
    <meta property="og:image" content="https://touchofambrosia.com">
    <meta name="twitter:card" content="summary">

    <!-- Font Preloads -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!-- Profile Avatar Image -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="Amber Rasmussen Profile Picture" width="128" height="128" fetchpriority="high">

            <!-- Name / Brand Title -->
            <h1>Amber Rasmussen</h1>

            <!-- Bio / Tagline -->
            <p>Welcome to Touch of Ambrosia</p>

            <!-- Navigation Links Stack -->
            <nav class="button-stack" aria-label="Links">


              <!-- Instagram Placeholder -->
              <a class="button button-instagram" href="https://instagram.com/touch.of.ambrosia" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <!-- TikTok Placeholder -->
              <a class="button button-tiktok" href="https://tiktok.com" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/tiktok.svg" alt="TikTok Logo">TikTok</a>

            </nav>

          </main>
        </div>
    </div>

</body>
</html>
